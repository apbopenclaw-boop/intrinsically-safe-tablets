<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thank You — Explosion Proof Tablets</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f3f0;--ink:#1a1a1a;--graphite:#6b6b6b;--accent:#2563eb;}
  html,body{background:var(--bg);color:var(--ink);}
  body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .serif{font-family:'Instrument Serif',Georgia,serif;}
  .btn-pri{background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;font-size:.875rem;font-weight:500;text-decoration:none;display:inline-block;transition:all .2s;}
  .btn-pri:hover{opacity:.85;}
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
  <div class="max-w-[480px] text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-6 bg-blue-50 border border-blue-200">
      <svg class="w-8 h-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 class="serif text-[32px] leading-tight mb-3">Thank you</h1>
    <p class="text-[color:var(--graphite)] mb-8">Your message has been received. We'll get back to you as soon as possible.</p>
    <a href="/" class="btn-pri">Back to home</a>
  </div>
</body>
</html>
